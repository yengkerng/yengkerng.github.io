<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeng Tan</title>
  <meta name="description" content="Yeng Tan" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #fff;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-wrapper {
      position: relative;
      max-width: 750px;
      max-height: 550px;
      overflow: hidden;
      cursor: zoom-in;
    }

    .image-wrapper.zoomed {
      cursor: zoom-out;
    }

    .image-wrapper.zoomed.dragging {
      cursor: grabbing;
    }

    .image-wrapper.zoomed:active {
      cursor: grabbing;
    }

    .image-wrapper img {
      display: block;
      max-width: 100%;
      max-height: 550px;
      object-fit: contain;
      transition: transform 0.3s ease;
      transform-origin: center center;
      pointer-events: none;
    }

    .image-wrapper.zoomed img {
      transform: scale(2.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-wrapper" id="wrapper">
      <img src="img/map.webp" id="img" alt="" draggable="false" />
    </div>
  </div>

  <script>
    console.log('%cThose who know don\'t say; those who say don\'t know', 'font-style: italic; color: #888;');

    const wrapper = document.getElementById('wrapper');
    const img = document.getElementById('img');
    
    let zoomed = false;
    let isDragging = false;
    let startX, startY;
    let originX = 50, originY = 50;

    // Click to zoom in/out
    wrapper.addEventListener('click', (e) => {
      if (isDragging) return; // Don't toggle if we were dragging
      
      if (!zoomed) {
        // Zoom in at click point
        const rect = wrapper.getBoundingClientRect();
        originX = ((e.clientX - rect.left) / rect.width) * 100;
        originY = ((e.clientY - rect.top) / rect.height) * 100;
        img.style.transformOrigin = `${originX}% ${originY}%`;
        zoomed = true;
        wrapper.classList.add('zoomed');
      } else {
        // Zoom out
        zoomed = false;
        wrapper.classList.remove('zoomed');
      }
    });

    // Drag to pan when zoomed
    wrapper.addEventListener('mousedown', (e) => {
      if (!zoomed) return;
      e.preventDefault();
      isDragging = false;
      startX = e.clientX;
      startY = e.clientY;
      wrapper.classList.add('dragging');
      
      const onMove = (e) => {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        
        // Only count as dragging if moved more than 5px
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          isDragging = true;
        }
        
        // Adjust origin based on drag (inverted because we're moving the origin)
        const rect = wrapper.getBoundingClientRect();
        const sensitivity = 100 / rect.width * 0.5;
        
        let newOriginX = originX - dx * sensitivity;
        let newOriginY = originY - dy * sensitivity;
        
        // Clamp to reasonable bounds
        newOriginX = Math.max(0, Math.min(100, newOriginX));
        newOriginY = Math.max(0, Math.min(100, newOriginY));
        
        img.style.transformOrigin = `${newOriginX}% ${newOriginY}%`;
      };
      
      const onUp = (e) => {
        wrapper.classList.remove('dragging');
        
        // Update stored origin
        const rect = wrapper.getBoundingClientRect();
        const sensitivity = 100 / rect.width * 0.5;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        
        originX = Math.max(0, Math.min(100, originX - dx * sensitivity));
        originY = Math.max(0, Math.min(100, originY - dy * sensitivity));
        
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        
        // Reset drag flag after a tick to prevent click from firing
        setTimeout(() => { isDragging = false; }, 10);
      };
      
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  </script>
</body>
</html>
